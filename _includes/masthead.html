{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<button id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode" title="Toggle dark mode">
  <span class="theme-switch__track">
    <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">&#9728;</span>
    <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">&#9789;</span>
    <span class="theme-switch__knob"></span>
  </span>
</button>
<script>
  (function () {
    var sw = document.getElementById('theme-switch');
    if (!sw) return;
    function current() {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr) return attr;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function apply(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      sw.setAttribute('aria-checked', theme === 'dark' ? 'true' : 'false');
    }
    apply(current());
    sw.addEventListener('click', function () {
      var next = current() === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (err) {}
        if (!stored) apply(e.matches ? 'dark' : 'light');
      });
    }
  })();
</script>
