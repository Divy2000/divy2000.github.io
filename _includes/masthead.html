{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Open navigation menu" aria-expanded="false"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<button id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode" title="Switch to dark mode">
  <span class="theme-switch__track">
    <span class="theme-switch__knob">
      <span class="theme-switch__icon" aria-hidden="true"></span>
    </span>
  </span>
</button>
<script>
  (function () {
    var sw = document.getElementById('theme-switch');
    if (!sw) return;
    function current() {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr) return attr;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function apply(theme) {
      var dark = theme === 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      sw.setAttribute('aria-checked', dark ? 'true' : 'false');
      sw.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', dark ? '#0f1216' : '#ffffff');
    }
    apply(current());
    sw.addEventListener('click', function () {
      apply(current() === 'dark' ? 'light' : 'dark');
      try { localStorage.setItem('theme', document.documentElement.getAttribute('data-theme')); } catch (e) {}
    });
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var stored = null;
        try { stored = localStorage.getItem('theme'); } catch (err) {}
        if (!stored) apply(e.matches ? 'dark' : 'light');
      });
    }
  })();

  (function () {
    var nav = document.getElementById('site-nav');
    if (!nav) return;
    var btn = nav.querySelector('button');
    var panel = nav.querySelector('.hidden-links');
    if (!btn || !panel) return;
    btn.setAttribute('aria-controls', 'site-nav-menu');
    panel.id = 'site-nav-menu';
    var sync = function () {
      btn.setAttribute('aria-expanded', panel.classList.contains('hidden') ? 'false' : 'true');
    };
    new MutationObserver(sync).observe(panel, { attributes: true, attributeFilter: ['class'] });
    sync();
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !panel.classList.contains('hidden')) {
        panel.classList.add('hidden');
        btn.focus();
      }
    });
  })();
</script>
